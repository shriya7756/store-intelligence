<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Store Intelligence - Live Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: hsl(217, 91%, 60%);
            --primary-glow: hsla(217, 91%, 60%, 0.15);
            --bg: hsl(222, 47%, 11%);
            --card-bg: hsla(223, 47%, 16%, 0.6);
            --card-border: hsla(223, 47%, 26%, 0.4);
            --text-main: hsl(210, 40%, 98%);
            --text-muted: hsl(215, 20%, 65%);
            --accent-green: hsl(142, 71%, 45%);
            --accent-green-glow: hsla(142, 71%, 45%, 0.2);
            --font-outfit: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-outfit);
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0.2) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(217, 91%, 60%, 0.05) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 2rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        header {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.5rem 2rem;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .logo-section h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, hsl(210, 40%, 98%) 30%, hsl(217, 91%, 60%) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 0.2rem;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .store-selector {
            background: hsl(223, 47%, 8%);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-family: var(--font-outfit);
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .store-selector:hover, .store-selector:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-green);
            background: var(--accent-green-glow);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid hsla(142, 71%, 45%, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 hsla(142, 71%, 45%, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px hsla(142, 71%, 45%, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 hsla(142, 71%, 45%, 0); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, hsl(217, 91%, 60%), hsl(263, 90%, 61%));
            opacity: 0.8;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: hsla(217, 91%, 60%, 0.3);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .label {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .value {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.1;
            margin: 1.5rem 0;
            letter-spacing: -2px;
        }

        .footer-note {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .sparkline-placeholder {
            height: 4px;
            width: 100%;
            background: hsla(217, 91%, 60%, 0.1);
            border-radius: 2px;
            position: relative;
            margin-top: 1rem;
            overflow: hidden;
        }

        .sparkline-bar {
            height: 100%;
            width: 70%;
            background: linear-gradient(90deg, var(--primary), hsl(263, 90%, 61%));
            border-radius: 2px;
            animation: expand 1.5s ease-out forwards;
        }

        @keyframes expand {
            from { width: 0%; }
            to { width: 70%; }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1.5rem;
                align-items: flex-start;
            }
            .controls {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-section">
                <h1>Store Intelligence</h1>
                <p>Real-time computer vision retail analytics</p>
            </div>
            <div class="controls">
                <select id="storeSelect" class="store-selector" onchange="onStoreChange()">
                    <option value="ST1008">Apex Retail 1008 (ST1008)</option>
                    <option value="STORE_BLR_002">Apex Bangalore 002 (STORE_BLR_002)</option>
                </select>
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span>LIVE CONNECTED</span>
                </div>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <span class="label">Unique Visitors</span>
                    <div class="value" id="val-visitors">--</div>
                </div>
                <div class="footer-note">
                    <span>Active customer entries today</span>
                </div>
                <div class="sparkline-placeholder"><div class="sparkline-bar" style="width: 85%;"></div></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="label">Conversion Rate</span>
                    <div class="value" id="val-conversion">--%</div>
                </div>
                <div class="footer-note">
                    <span>Completed checkout ratio</span>
                </div>
                <div class="sparkline-placeholder"><div class="sparkline-bar" style="width: 55%; background: linear-gradient(90deg, hsl(263, 90%, 61%), hsl(320, 90%, 61%));"></div></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="label">Billing Queue Depth</span>
                    <div class="value" id="val-queue">--</div>
                </div>
                <div class="footer-note">
                    <span>Customers currently in queue</span>
                </div>
                <div class="sparkline-placeholder"><div class="sparkline-bar" style="width: 30%; background: linear-gradient(90deg, var(--accent-green), var(--primary));"></div></div>
            </div>
        </div>
    </div>

    <script>
        let fetchInterval = null;

        async function fetchMetrics() {
            const storeId = document.getElementById('storeSelect').value;
            try {
                const res = await fetch(`/stores/${storeId}/metrics`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('val-visitors').innerText = data.unique_visitors;
                    document.getElementById('val-conversion').innerText = (data.conversion_rate * 100).toFixed(1) + '%';
                    document.getElementById('val-queue').innerText = data.queue_depth;
                }
            } catch (err) {
                console.error("Error fetching metrics", err);
            }
        }

        function onStoreChange() {
            // Fetch immediately on store change
            fetchMetrics();
        }
        
        // Start polling
        fetchMetrics();
        fetchInterval = setInterval(fetchMetrics, 2000);
    </script>
</body>
</html>
